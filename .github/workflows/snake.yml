name: Regenerate profile assets

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run generate
        env:
          # Falls back to the default token; swap in a classic PAT with the
          # read:user scope here (as repo secret PROFILE_GH_TOKEN) if contribution
          # counts come back empty — see scripts/lib/contributions.js.
          PROFILE_GH_TOKEN: ${{ secrets.PROFILE_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate profile SVGs'
          file_pattern: 'assets/*.svg'
